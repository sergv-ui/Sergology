<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sergology">
<meta name="theme-color" content="#1c1b19">
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--mute:#76726a;--line:#e3dfd6;--acc:#e8481c;--acc2:#fff;--ok:#2f9e5b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--card:#1e1d1b;--ink:#f1eee8;--mute:#9a958b;--line:#33312d;--acc:#ff6a3d;--acc2:#141413;--ok:#4cc27f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141413;--card:#1e1d1b;--ink:#f1eee8;--mute:#9a958b;--line:#33312d;--acc:#ff6a3d;--acc2:#141413;--ok:#4cc27f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 12px;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mute);margin-bottom:3px}
input{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;min-width:0}
input:focus{outline:2px solid var(--acc);outline-offset:-1px}
.row{display:flex;gap:8px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:8px;padding:6px 10px}
button.p{background:var(--acc);color:var(--acc2);border-color:var(--acc);font-weight:600}
button.x{border:none;color:var(--mute);padding:4px 7px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.tab{white-space:nowrap;flex:none}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ok)}
.mute{color:var(--mute);font-size:13px}
.day{border-top:1px solid var(--line);padding:10px 0}
.day h3{margin:0 0 6px;font-size:14px}
.sess{background:var(--bg);border-radius:10px;padding:8px;margin-bottom:8px}
.item{display:flex;gap:6px;align-items:center;margin-top:6px}
.item input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--ok)}
.item input.done{text-decoration:line-through;color:var(--mute)}
.mins{width:70px;flex:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.spb{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sp{min-width:38px;height:38px;border:3px solid var(--line);background:transparent;border-radius:8px;font-weight:700;color:var(--ink);padding:0 8px}
.sp.s-done{border-color:#d64545}
.sp.s-now{border-color:#f2b705}
.sp.s-next{border-color:#2f9e5b}
.sp.sel{outline:2px solid var(--ink);outline-offset:2px}
.lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;font-size:12px;color:var(--mute)}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
.num{width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--acc2);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.tab.s-done{border:2px solid #d64545}
.tab.s-now{border:2px solid #f2b705}
.tab.s-next{border:2px solid #2f9e5b}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.tile{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.tile b{display:block;font-size:20px}
.tile span{font-size:12px}
.chart{width:100%;height:auto;display:block;margin-top:10px}
.chart .gr{stroke:var(--line);stroke-width:1}
.chart .ln{fill:none;stroke:var(--acc);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .dt{fill:var(--acc)}
.chart .bt{stroke:var(--mute);stroke-width:1.5;stroke-dasharray:5 4}
.chart .tx{fill:var(--mute);font-size:11px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.rest{color:var(--mute);font-size:13px}
.badge{display:inline-block;background:var(--acc);color:var(--acc2);border-radius:6px;padding:1px 7px;font-size:12px;font-weight:600}
textarea{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%;resize:vertical}
textarea:focus{outline:2px solid var(--acc);outline-offset:-1px}
.why{margin-top:6px;font-size:13px}
</style>
</head>
<body>
<main>
<h1>Sergology</h1>
<div class="card" id="setup"></div>
<div class="card" id="sprints"></div>
<div class="card" id="dash"></div>

<div class="tabs" id="secs"></div>
<div id="rounds"></div>
<div id="kitchen"></div>
<div class="tabs" id="tabs"></div>
<div id="week"></div>
</main>
<script>
var KEY='breaking-sprints-v1',DAY=864e5,S=load(),cur=0;
function load(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function pd(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function it(t){return {t:t,done:false}}
function ss(title,mins,items){return {title:title,mins:mins,items:items.map(it)}}
var PH={
 foundation:{focus:'Foundation: build base, clean basics',days:[
  [ss('Conditioning',40,['Cardio intervals 5 x 2 min','Core circuit','Mobility flow'])],[],
  [ss('Foundation drills',60,['Toprock variations','Footwork: 6-step, CC, 3-step','Freeze holds'])],[],
  [ss('Power / floor work',60,['Power move drills','Transitions in and out of floor'])],
  [ss('Open practice',60,['Freestyle rounds','Cypher with crew'])],[]]},
 build:{focus:'Build: combos, musicality, endurance',days:[
  [ss('Conditioning',45,['Cardio intervals 6 x 2 min','Strength: push, pull, legs','Mobility flow'])],
  [ss('Combos',60,['Write 3 new combos','Drill each combo 10x'])],
  [ss('Musicality',45,['Practice to varied BPMs','Hit breaks and accents'])],[],
  [ss('Set building',60,['Build 2 full sets','Run sets back to back'])],
  [ss('Open practice',75,['Freestyle rounds','Cypher with crew'])],[]]},
 prep:{focus:'Battle prep: simulate rounds, sharpen sets',days:[
  [ss('Round simulation',60,['1-minute rounds x 8','Record and review footage'])],
  [ss('Conditioning',40,['Interval circuit','Mobility flow'])],
  [ss('Set polish',60,['Clean weakest combo','Run full sets with music'])],
  [ss('Sparring',75,['Practice battle vs crew','Feedback notes'])],[],
  [ss('Open practice',60,['Freestyle rounds','Cypher'])],[]]},
 taper:{focus:'Taper: stay sharp, rest up',days:[
  [ss('Light run-through',40,['Run best sets at 70%','Mobility flow'])],[],
  [ss('Freestyle',30,['Loose rounds, stay relaxed'])],[],
  [ss('Prep & mental',20,['Visualize rounds','Pack bag, plan warm-up'])],[],[]]}
};
function phase(i,n){if(n<=1)return 'prep';var f=i/(n-1);if(n<=2)return i?'prep':'build';if(i===n-1)return 'taper';if(f<.35)return 'foundation';if(f<.7)return 'build';return 'prep'}
function gen(n){var w=[];for(var i=0;i<n;i++){var p=PH[phase(i,n)];w.push(JSON.parse(JSON.stringify({focus:p.focus,days:p.days})))}return w}
function weeksFor(s,b){return Math.max(1,Math.min(26,Math.ceil((pd(b)-pd(s)+DAY)/(7*DAY))))}
if(!S){var t=new Date(),b=new Date(t.getTime()+55*DAY);S={name:'My next battle',start:iso(t),battle:iso(b),weeks:gen(8)}}
if(!S.phil)S.phil=[{t:'Train the weakest area first'},{t:'Rest days are part of the plan'},{t:'Review footage every week'}];
if(!S.weigh)S.weigh=[];if(!S.unit)S.unit='lb';var flash='';
if(!S.rounds)S.rounds=[];if(!S.sec)S.sec='rounds';if(!S.kitchen)S.kitchen=[];if(!S.catv2){S.kitchen.forEach(function(c){c.c=''});S.catv2=1}if(S.sec==='plan')S.sec='rounds';
function renderSecs(){
 document.getElementById('secs').innerHTML='<button class="tab'+(S.sec==='rounds'?' on':'')+'" data-a="sec" data-v="rounds">Battle Rounds</button><button class="tab'+(S.sec==='kitchen'?' on':'')+'" data-a="sec" data-v="kitchen">Scratch Kitchen</button>';
 document.getElementById('rounds').style.display=S.sec==='rounds'?'':'none';
 document.getElementById('tabs').style.display=document.getElementById('week').style.display='none';document.getElementById('kitchen').style.display=S.sec==='kitchen'?'':'none'}
var CATS=['Intro','Footwork','Powermoves','Combo','Ending'];
function renderKitchen(){
 var h='<div class="card"><label>Scratch Kitchen: new combos still cooking</label>';
 if(!S.kitchen.length)h+='<div class="mute">Nothing cooking yet. Add a combo you are still working on.</div>';
 S.kitchen.forEach(function(c,i){
  h+='<div class="sess" style="margin-top:10px"><div class="row"><input data-k="kt" data-i="'+i+'" value="'+esc(c.t)+'" placeholder="Combo name"><button class="x" data-a="ktog" data-i="'+i+'" aria-label="Show or hide details">'+(c.o?'▴':'▾')+'</button><button class="x" data-a="kdel" data-i="'+i+'" aria-label="Delete combo">\u2715</button></div>'+
  (c.o?'<div class="row" style="margin-top:8px"><select style="'+(c.c?'':'border-color:#d64545;border-width:2px;')+'" data-k="kc" data-i="'+i+'" aria-label="Category">'+'<option value=""'+(c.c?'':' selected')+' disabled>Choose category...</option>'+CATS.map(function(x){return '<option'+(c.c===x?' selected':'')+'>'+x+'</option>'}).join('')+'</select></div><label style="margin-top:8px">The combo and notes</label><textarea rows="4" data-k="km" data-i="'+i+'">'+esc(c.m)+'</textarea>'+
  '<div class="acts"><button data-a="kst" data-i="'+i+'">'+(c.st==='ready'?'🟢 Ready':'🟡 Lab')+'</button>'+(c.st==='ready'?'<button data-a="kmove" data-i="'+i+'">Move to Battle Rounds</button>':'')+'</div>':'')+'</div>'});
 h+='<div class="acts"><button class="p" data-a="kadd">+ New combo</button></div></div>';
 document.getElementById('kitchen').innerHTML=h}
function renderRounds(){
 var h='<div class="card"><label>Battle Rounds: keep them fresh</label>';
 if(!S.rounds.length)h+='<div class="mute">No rounds yet. Add your first one.</div>';
 S.rounds.forEach(function(r,i){
  h+='<div class="sess" style="margin-top:10px"><div class="row"><span class="num">'+(i+1)+'</span><input data-k="rt" data-i="'+i+'" value="'+esc(r.t)+'" placeholder="Round name"><button class="x" data-a="rup" data-i="'+i+'" aria-label="Move up">\u2191</button><button class="x" data-a="rdn" data-i="'+i+'" aria-label="Move down">\u2193</button><button class="x" data-a="rdel" data-i="'+i+'" aria-label="Delete round">\u2715</button></div>'+
  '<label style="margin-top:8px">What is in it</label><textarea rows="3" data-k="rm" data-i="'+i+'">'+esc(r.m)+'</textarea>'+
  '<label style="margin-top:8px">Needed next time I revisit</label><textarea rows="2" data-k="rn" data-i="'+i+'">'+esc(r.n)+'</textarea>'+
  '<div class="acts"><button data-a="rrev" data-i="'+i+'">Revisited today</button><span class="mute" style="align-self:center">'+(r.rev?'Last revisited '+fmt(pd(r.rev)):'Not revisited yet')+'</span></div></div>'});
 h+='<div class="acts"><button class="p" data-a="radd">+ Add round</button></div></div>';
 document.getElementById('rounds').innerHTML=h}
function sprintState(i){var t=new Date(new Date().setHours(0,0,0,0)).getTime(),s=pd(S.start).getTime()+i*7*DAY,e=s+6*DAY;return t>e?'done':t>=s?'now':'next'}
function renderSprints(){
 var n=S.weeks.length,act=-1,dn=0,i;
 for(i=0;i<n;i++){var st=sprintState(i);if(st==='now')act=i;if(st==='done')dn++}
 var big,sub='';
 if(act>=0){var a0=new Date(pd(S.start).getTime()+act*7*DAY);big='Sprint '+(act+1)+' of '+n;sub=fmt(a0)+' to '+fmt(new Date(a0.getTime()+6*DAY))}
 else if(dn===n){big='All '+n+' sprints complete'}
 else{big='Sprint 1 of '+n+' starts '+fmt(pd(S.start))}
 var h='<label>Active sprint</label><div style="font-size:22px;font-weight:700">'+big+'</div><div class="mute">'+sub+'</div><div class="spb">';
 for(i=0;i<n;i++)h+='<button class="sp s-'+sprintState(i)+(sprintState(i)==='now'?' sel':'')+'" aria-label="Sprint '+(i+1)+'">'+(i+1)+'</button>';
 h+='</div><div class="lg"><span><i style="border:2px solid #d64545"></i>Completed</span><span><i style="border:2px solid #f2b705"></i>Current</span><span><i style="border:2px solid #2f9e5b"></i>Upcoming</span></div>';
 document.getElementById('sprints').innerHTML=h}
function renderDash(){
 var left=Math.ceil((pd(S.battle)-new Date(new Date().setHours(0,0,0,0)))/DAY),D=0,T=0,wl=S.weigh,u=S.unit,td=iso(new Date());
 S.weeks.forEach(function(x){var s=stats(x);D+=s[0];T+=s[1]});
 var chg=wl.length>1?wl[wl.length-1].w-wl[0].w:0;
 var tl='<div class="tiles" style="margin:12px 0 0"><div class="tile"><b>'+(left>0?left:0)+'</b><span class="mute">days to battle</span></div><div class="tile"><b>'+(T?Math.round(D/T*100):0)+'%</b><span class="mute">plan done</span></div><div class="tile"><b>'+(chg>0?'+':'')+chg.toFixed(1)+'</b><span class="mute">'+u+' since first weigh-in</span></div></div>';
 var h='<label>Dashboard: daily weigh-in</label><div class="row" style="flex-wrap:wrap"><input type="date" id="wd" value="'+td+'" style="flex:1;min-width:130px"><input type="number" id="wv" step="0.1" autocomplete="off" inputmode="decimal" placeholder="Weight" style="flex:1;min-width:90px"><button data-a="unit">'+u+'</button><button class="p" data-a="addweigh">Log</button><button data-a="delweigh">Undo</button></div>'+(flash?'<div class="mute" style="margin-top:6px">'+flash+'</div>':'');
 if(!wl.length){h+='<div class="mute" style="margin-top:10px">Log your first weigh-in to start the chart.</div>'}
 else{
  var W=600,H=220,L=40,R=16,Tp=14,B=26;
  var t0=Math.min(pd(S.start).getTime(),pd(wl[0].d).getTime()),t1=Math.max(pd(S.battle).getTime(),pd(wl[wl.length-1].d).getTime());
  if(t1<=t0)t1=t0+DAY;
  var vs=wl.map(function(x){return x.w}),lo=Math.min.apply(null,vs),hi=Math.max.apply(null,vs);
  if(hi-lo<2){lo-=1;hi+=1}else{var pad=(hi-lo)*.15;lo-=pad;hi+=pad}
  var X=function(d){return L+(pd(d).getTime()-t0)/(t1-t0)*(W-L-R)},Y=function(v){return Tp+(1-(v-lo)/(hi-lo))*(H-Tp-B)};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weigh-in chart">';
  [0,.5,1].forEach(function(f){var v=lo+(hi-lo)*f,y=Y(v);s+='<line class="gr" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="tx" x="'+(L-6)+'" y="'+(y+4)+'" text-anchor="end">'+v.toFixed(1)+'</text>'});
  var bx=X(S.battle);
  s+='<line class="bt" x1="'+bx+'" x2="'+bx+'" y1="'+Tp+'" y2="'+(H-B)+'"/><text class="tx" x="'+(bx-4)+'" y="'+(Tp+10)+'" text-anchor="end">Battle</text>';
  s+='<polyline class="ln" points="'+wl.map(function(x){return X(x.d).toFixed(1)+','+Y(x.w).toFixed(1)}).join(' ')+'"/>';
  wl.forEach(function(x){s+='<circle class="dt" cx="'+X(x.d).toFixed(1)+'" cy="'+Y(x.w).toFixed(1)+'" r="4"><title>'+x.d+': '+x.w+' '+u+'</title></circle>'});
  s+='<text class="tx" x="'+L+'" y="'+(H-6)+'">'+fmt(new Date(t0))+'</text><text class="tx" x="'+(W-R)+'" y="'+(H-6)+'" text-anchor="end">'+fmt(new Date(t1))+'</text></svg>';
  h+=s}
 document.getElementById('dash').innerHTML=h}
function renderPhil(){var h='<label>My training philosophy: principles that shape every sprint (replace these with yours)</label>';S.phil.forEach(function(p,i){h+='<div class="item"><input data-k="phil" data-i="'+i+'" value="'+esc(p.t)+'" placeholder="A principle in your words"><button class="x" data-a="delphil" data-i="'+i+'" aria-label="Delete principle">✕</button></div>'});h+='<div class="acts"><button data-a="addphil">+ Principle</button></div>';document.getElementById('phil').innerHTML=h}
function stats(w){var a=0,d=0;w.days.forEach(function(x){x.forEach(function(s){s.items.forEach(function(i){a++;if(i.done)d++})})});return [d,a]}
function fmt(d){return d.toLocaleDateString(undefined,{month:'short',day:'numeric'})}
function render(){
 var left=Math.ceil((pd(S.battle)-new Date(new Date().setHours(0,0,0,0)))/DAY);
 document.getElementById('setup').innerHTML=
  '<label>Battle title</label><input data-k="name" value="'+esc(S.name)+'" style="font-size:20px;font-weight:700;margin-bottom:10px"><div class="two">'+
  '<div><label>Start date</label><input type="date" data-k="start" value="'+S.start+'"></div>'+
  '<div><label>End date (battle day)</label><input type="date" data-k="battle" value="'+S.battle+'"></div></div>'+
  '<div class="acts"><span class="badge">'+(left>=0?left+' days to go':'Battle passed')+'</span><span class="mute" style="align-self:center">'+S.weeks.length+' week sprints</span>'+
  '<button data-a="regen">Rebuild plan from dates</button></div>';
 renderSprints();renderDash();renderSecs();renderRounds();renderKitchen();var tb='';S.weeks.forEach(function(w,i){var s=stats(w);tb+='<button class="tab s-'+sprintState(i)+(i===cur?' on':'')+'" data-a="tab" data-w="'+i+'">W'+(i+1)+(s[1]&&s[0]===s[1]?' ✓':'')+'</button>'});
 tb+='<button class="tab" data-a="addweek">+ Week</button>';
 document.getElementById('tabs').innerHTML=tb;
 if(cur>=S.weeks.length)cur=S.weeks.length-1;
 var w=S.weeks[cur],st=stats(w),pct=st[1]?Math.round(st[0]/st[1]*100):0;
 var ws=new Date(pd(S.start).getTime()+cur*7*DAY),h='<div class="card"><div class="row"><div style="flex:1"><label>Sprint '+(cur+1)+' of '+S.weeks.length+' · '+fmt(ws)+' to '+fmt(new Date(ws.getTime()+6*DAY))+'</label><input data-k="focus" value="'+esc(w.focus)+'" placeholder="Sprint focus"></div></div>'+
  '<div class="bar"><i style="width:'+pct+'%"></i></div><div class="mute">'+st[0]+' of '+st[1]+' exercises done ('+pct+'%)</div>';
 h+='<div style="margin-top:10px"><label>Sprint intent: the one thing this week is about</label><input data-k="intent" value="'+esc(w.intent)+'" placeholder="e.g. clean up footwork"></div>';
 w.days.forEach(function(sessions,d){
  var dt=new Date(ws.getTime()+d*DAY);
  h+='<div class="day"><h3>'+dt.toLocaleDateString(undefined,{weekday:'long'})+' <span class="mute">'+fmt(dt)+'</span></h3>';
  if(!sessions.length)h+='<div class="rest">Rest day</div>';
  sessions.forEach(function(s,si){
   h+='<div class="sess"><div class="row"><input data-k="title" data-d="'+d+'" data-s="'+si+'" value="'+esc(s.title)+'" placeholder="Session"><input class="mins" type="number" data-k="mins" data-d="'+d+'" data-s="'+si+'" value="'+esc(s.mins)+'" aria-label="Minutes"><span class="mute">min</span><button class="x" data-a="delsess" data-d="'+d+'" data-s="'+si+'" aria-label="Delete session">✕</button></div>';
   s.items.forEach(function(x,ii){
    h+='<div class="item"><input type="checkbox" data-k="done" data-d="'+d+'" data-s="'+si+'" data-i="'+ii+'"'+(x.done?' checked':'')+'><input class="'+(x.done?'done':'')+'" data-k="item" data-d="'+d+'" data-s="'+si+'" data-i="'+ii+'" value="'+esc(x.t)+'"><button class="x" data-a="delitem" data-d="'+d+'" data-s="'+si+'" data-i="'+ii+'" aria-label="Delete exercise">✕</button></div>'});
   h+='<input class="why" data-k="why" data-d="'+d+'" data-s="'+si+'" value="'+esc(s.why)+'" placeholder="Why this session? (your intent)">';
   h+='<div class="acts"><button data-a="additem" data-d="'+d+'" data-s="'+si+'">+ Exercise</button></div></div>'});
  h+='<button data-a="addsess" data-d="'+d+'">+ Session</button></div>'});
 h+='<div style="margin-top:12px"><label>End-of-sprint review: what worked, what to change next week</label><textarea rows="3" data-k="review">'+esc(w.review)+'</textarea></div>';
 h+='<div class="acts"><button data-a="copynext">Copy week to next</button><button data-a="resetw">Uncheck all</button><button data-a="delweek">Delete week</button></div></div>';
 document.getElementById('week').innerHTML=h}
function ref(e){var d=e.dataset;return {w:S.weeks[cur],d:+d.d,s:+d.s,i:+d.i}}
document.addEventListener('input',function(e){var el=e.target,k=el.dataset.k;if(!k)return;var r=ref(el);
 if(k==='name')S.name=el.value;
 else if(k==='start'||k==='battle'){if(!el.value)return;S[k]=el.value;save();render();return}
 else if(k==='focus')r.w.focus=el.value;
 else if(k==='title')r.w.days[r.d][r.s].title=el.value;
 else if(k==='mins')r.w.days[r.d][r.s].mins=el.value;
 else if(k==='item')r.w.days[r.d][r.s].items[r.i].t=el.value;
 else if(k==='phil')S.phil[r.i].t=el.value;
 else if(k==='rt')S.rounds[r.i].t=el.value;
 else if(k==='rm')S.rounds[r.i].m=el.value;
 else if(k==='rn')S.rounds[r.i].n=el.value;
 else if(k==='kt')S.kitchen[r.i].t=el.value;
 else if(k==='km')S.kitchen[r.i].m=el.value;
 else if(k==='kc')S.kitchen[r.i].c=el.value;
 else if(k==='intent')r.w.intent=el.value;
 else if(k==='review')r.w.review=el.value;
 else if(k==='why')r.w.days[r.d][r.s].why=el.value;
 save()});
document.addEventListener('change',function(e){var el=e.target;if(el.dataset.k==='done'){var r=ref(el);r.w.days[r.d][r.s].items[r.i].done=el.checked;save();render()}});
document.addEventListener('click',function(e){var b=e.target.closest('button[data-a]');if(!b)return;var a=b.dataset.a,r=ref(b),w=S.weeks[cur];if(a!=='addweigh'&&a!=='delweigh')flash='';
 if(a==='tab'){cur=+b.dataset.w}
 else if(a==='addphil')S.phil.push({t:''});
 else if(a==='sec')S.sec=b.dataset.v;
 else if(a==='radd')S.rounds.push({t:'',m:'',n:'',rev:''});
 else if(a==='rdel'){if(!confirm('Delete this round?'))return;S.rounds.splice(r.i,1)}
 else if(a==='rup'){if(r.i>0){var tp=S.rounds[r.i];S.rounds[r.i]=S.rounds[r.i-1];S.rounds[r.i-1]=tp}}
 else if(a==='rdn'){if(r.i<S.rounds.length-1){var tq=S.rounds[r.i];S.rounds[r.i]=S.rounds[r.i+1];S.rounds[r.i+1]=tq}}
 else if(a==='rrev')S.rounds[r.i].rev=iso(new Date());
 else if(a==='kadd')S.kitchen.push({t:'',m:'',c:'',st:'lab'});
 else if(a==='ktog')S.kitchen[r.i].o=!S.kitchen[r.i].o;
 else if(a==='kdel'){if(!confirm('Delete this combo?'))return;S.kitchen.splice(r.i,1)}
 else if(a==='kst'){var kk=S.kitchen[r.i];if(kk.st!=='ready'&&!kk.c){alert('Choose a category first: Intro, Footwork, Powermoves, Combo or Ending.');return}kk.st=kk.st==='ready'?'lab':'ready'}
 else if(a==='kmove'){var kc=S.kitchen[r.i];if(!kc.c){alert('Choose a category first.');return}S.rounds.push({t:kc.t,m:(kc.c||'Combo')+'\n'+kc.m,n:'',rev:''});S.kitchen.splice(r.i,1);S.sec='rounds'}
 else if(a==='delphil')S.phil.splice(r.i,1);
 else if(a==='addweigh'){var wv=parseFloat(document.getElementById('wv').value),wdt=document.getElementById('wd').value;if(!wv||!wdt)return;S.weigh=S.weigh.filter(function(x){return x.d!==wdt});S.weigh.push({d:wdt,w:wv});flash='Logged '+wv+' '+S.unit+'. Box is clear for the next entry.';S.weigh.sort(function(p,q){return p.d<q.d?-1:1})}
 else if(a==='delweigh'){S.weigh.pop();flash='Last entry removed.'}
 else if(a==='unit'){var f=S.unit==='lb'?1/2.20462:2.20462;S.weigh.forEach(function(x){x.w=Math.round(x.w*f*10)/10});S.unit=S.unit==='lb'?'kg':'lb'}
 else if(a==='addweek'){S.weeks.push({focus:'New sprint',days:[[],[],[],[],[],[],[]]});cur=S.weeks.length-1}
 else if(a==='delweek'){if(S.weeks.length<2||!confirm('Delete this week?'))return;S.weeks.splice(cur,1)}
 else if(a==='regen'){if(!confirm('Replace all weeks with a fresh plan for these dates? Your edits will be lost.'))return;S.weeks=gen(weeksFor(S.start,S.battle));cur=0}
 else if(a==='addsess')w.days[r.d].push(ss('New session',45,['']));
 else if(a==='delsess')w.days[r.d].splice(r.s,1);
 else if(a==='additem')w.days[r.d][r.s].items.push(it(''));
 else if(a==='delitem')w.days[r.d][r.s].items.splice(r.i,1);
 else if(a==='resetw')w.days.forEach(function(x){x.forEach(function(s){s.items.forEach(function(i){i.done=false})})});
 else if(a==='copynext'){var c=JSON.parse(JSON.stringify(w));c.days.forEach(function(x){x.forEach(function(s){s.items.forEach(function(i){i.done=false})})});if(cur+1<S.weeks.length){if(!confirm('Overwrite next week with this one?'))return;S.weeks[cur+1]=c}else S.weeks.push(c);cur++}
 save();render()});
render();
</script>
